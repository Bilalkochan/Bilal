<!-- MEVLİD V73 — V72 DOSYASININ EN ALTINA EKLEYİN -->
<style id="hk-v73-css">
html,body{width:100%;max-width:100%;overflow-x:hidden!important}
img,video,iframe{max-width:100%}

/* Butonlar arasındaki boşluk */
.hk-cards-wrap .hk-card-body>.btn-primary{margin:12px 0 0!important}
.hk-cards-wrap .hk-btn-group,#hk-yatay-kart .hk-btn-group{
  display:flex!important;width:100%!important;gap:10px!important;
  margin:10px 0 0!important;flex-wrap:nowrap!important
}
.hk-cards-wrap .hk-btn-group .btn,#hk-yatay-kart .hk-btn-group .btn{
  flex:1 1 0!important;width:auto!important;min-width:0!important;
  height:50px!important;min-height:50px!important;margin:0!important;
  padding:0 12px!important;display:flex!important;align-items:center!important;
  justify-content:center!important;border-radius:12px!important;
  line-height:1.1!important;white-space:normal!important;text-align:center!important
}
#hk-yatay-kart .hk-donate-btn{margin:0!important}

/* Suriye / Afganistan paket düğmeleri */
#hk-yatay-kart .hk-amount-presets{
  display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;
  gap:8px!important
}
#hk-yatay-kart .hk-amount-presets button{
  min-width:0!important;padding:8px 4px!important;white-space:nowrap!important
}
#hk-yatay-kart .hk-amount-presets button[data-other="1"]{border-style:dashed!important}
#hk-yatay-kart .hk-amount-presets button.active::after{content:' ✓';font-weight:900}

/* Hesap bilgileri popup */
.hk-account-swal{border-radius:18px!important;padding:22px!important}
.hk-account-swal .swal2-title{color:#024040!important;font-family:'Khand',sans-serif!important;font-weight:900!important}
.hk-account-swal .swal2-html-container{margin-left:0!important;margin-right:0!important}
.hk-swal-note{text-align:center;font-family:'Khand',sans-serif}
.hk-swal-note__title{margin:0 0 12px;color:#024040;font-size:18px;font-weight:900}
.hk-swal-note__box{padding:15px 16px;border:1px solid #e1e8ea;border-left:6px solid #024040;border-radius:14px;background:#f7fbfb}
.hk-swal-note__line{margin-bottom:8px;color:#333;font-size:14px}
.hk-swal-note__big{margin:8px 0;color:#b10f0f;font-size:16px;line-height:1.4;font-weight:900;text-transform:uppercase}
.hk-swal-note__big span{padding:2px 6px;border-radius:6px;background:rgba(177,15,15,.08)}
.hk-swal-note__small,.hk-swal-note__footer{color:#333;font-size:13.5px;line-height:1.5}
.hk-swal-note__footer{margin-top:12px}.hk-swal-note__footer strong{color:#024040}
.hk-swal-wide{width:100%!important;padding:14px!important;border:0!important;border-radius:12px!important;background:#0b9450!important;color:#fff!important;font-family:'Khand',sans-serif!important;font-weight:900!important}
.hk-account-swal .swal2-close{display:flex!important;width:40px!important;height:40px!important;font-size:25px!important;line-height:40px!important}

.hk-region-table-wrap{width:100%!important;max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}
.hk-v73-overflow-fix{max-width:100%!important;overflow-x:auto!important}

@media(max-width:680px){
  #hk-mevlid-page-intro{width:100%!important;max-width:100%!important;overflow:hidden!important}
  #hk-mevlid-page-intro h2{font-size:32px!important;line-height:1.08!important}

  .hk-cards-wrap{width:100%!important;max-width:100%!important;padding:0 10px!important;margin:0 auto!important;overflow:hidden!important}
  .hk-cards-wrap .hk-card{width:100%!important;max-width:100%!important;margin:8px auto!important}
  .hk-cards-wrap .hk-card-body{width:100%!important;padding:18px 16px!important}

  /* Ana kart görselleri kesilmez */
  .hk-cards-wrap .hk-banner{width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;aspect-ratio:auto!important;overflow:hidden!important}
  .hk-cards-wrap .hk-banner img{position:relative!important;width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;object-fit:contain!important;object-position:center!important}

  .hk-cards-wrap .hk-btn-group,#hk-yatay-kart .hk-btn-group{display:flex!important;flex-direction:column!important;gap:10px!important}
  .hk-cards-wrap .hk-btn-group .btn,#hk-yatay-kart .hk-btn-group .btn{flex:none!important;width:100%!important;margin:0!important}

  #hk-yatay-kart{width:100%!important;max-width:100%!important;padding:0 10px!important;overflow:hidden!important}
  #hk-yatay-kart .hk-card{width:100%!important;max-width:100%!important}
  #hk-yatay-kart .hk-banner{width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;aspect-ratio:16/9!important;overflow:hidden!important}
  #hk-yatay-kart .hk-banner img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important}
  #hk-yatay-kart .hk-amount-presets{grid-template-columns:1fr 1fr!important}
  #hk-yatay-kart .hk-amount-presets button[data-other="1"]{grid-column:1/-1!important}

  /* Sticky alt menü ve yüzen WhatsApp'ın üstünde */
  #hk-sticky72{left:10px!important;right:10px!important;bottom:calc(178px + env(safe-area-inset-bottom))!important;width:auto!important;max-width:none!important}
  .hk-v73-floating-wa{left:14px!important;right:auto!important;bottom:calc(92px + env(safe-area-inset-bottom))!important;z-index:99980!important}
  body{padding-bottom:264px!important}
}
@media(max-width:370px){.hk-cards-wrap,#hk-yatay-kart{padding-left:7px!important;padding-right:7px!important}#hk-sticky72{left:7px!important;right:7px!important}}
</style>

<script id="hk-v73-js">
(function(){
  'use strict';
  var PHONE='905523925851';
  var PHONE_DISPLAY='0552 392 58 51';
  var ACCOUNT_URL='https://www.hayirkapisi.org.tr/hesap-numaralarimiz';

  function ready(fn){
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true});
    else fn();
  }

  function sendInput(input){
    if(!input) return;
    try{input.dispatchEvent(new Event('input',{bubbles:true}));}catch(error){}
  }

  function normalizeWhatsappLinks(){
    var links=document.querySelectorAll('a[href*="wa.me/"],a[href*="api.whatsapp.com"],a[href*="whatsapp.com/send"]');
    Array.prototype.forEach.call(links,function(link){
      var oldHref=link.getAttribute('href')||'';
      var newHref=oldHref;
      if(oldHref.indexOf('wa.me/')!==-1) newHref=oldHref.replace(/wa\.me\/\d+/i,'wa.me/'+PHONE);
      else newHref=oldHref.replace(/([?&](?:phone|to)=)\+?\d+/i,'$1'+PHONE);
      if(newHref!==oldHref) link.setAttribute('href',newHref);
    });
  }

  function popupContent(){
    return '<div class="hk-swal-note">'+
      '<div class="hk-swal-note__title">Önemli Bilgilendirme</div>'+
      '<div class="hk-swal-note__box">'+
        '<div class="hk-swal-note__line">Bağış yaparken banka <strong>açıklama</strong> bölümüne</div>'+
        '<div class="hk-swal-note__big">SADECE <span>CEP TELEFONUNUZU</span> ve <span>“BAĞIŞ”</span> yazınız.</div>'+
        '<div class="hk-swal-note__small">Lütfen banka açıklama kısmına <strong>“BAĞIŞ” dışında</strong> not eklemeyiniz.</div>'+
      '</div>'+
      '<div class="hk-swal-note__footer">Video gönderimi yapılan projelerde görüntü iletimi için <strong>'+PHONE_DISPLAY+'</strong> WhatsApp hattımıza bilgilendirme yapmanızı rica ederiz.</div>'+
    '</div>';
  }

  window.hkHesapPopup=function(first,second){
    var event=null,element=null;
    if(first && typeof first.preventDefault==='function'){
      event=first;element=second||first.currentTarget||first.target;
    }else element=first;
    if(event){event.preventDefault();event.stopPropagation();}
    var target=(element&&(element.getAttribute('data-href')||element.getAttribute('href')))||ACCOUNT_URL;
    if(!window.Swal||typeof window.Swal.fire!=='function'){window.location.href=target;return false;}
    window.Swal.fire({
      icon:'success',title:'Hesap Bilgilerimiz',html:popupContent(),
      showCloseButton:true,showCancelButton:false,
      confirmButtonText:'HESAP BİLGİLERİNE GİT',buttonsStyling:false,width:620,
      customClass:{popup:'hk-account-swal',confirmButton:'hk-swal-wide'}
    }).then(function(result){if(result.isConfirmed) window.location.href=target;});
    return false;
  };

  function bindAccountButtons(){
    document.addEventListener('click',function(event){
      var target=event.target&&event.target.closest?event.target.closest('a[href*="/hesap-numaralarimiz"],button[data-href*="/hesap-numaralarimiz"],.hk-acc'):null;
      if(!target) return;
      event.preventDefault();event.stopPropagation();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      window.hkHesapPopup(event,target);
    },true);
  }

  function config(region){
    return region==='afganistan'?{min:50,values:[50,100,150,200]}:{min:60,values:[60,120,180,240]};
  }

  function setupCountryPackages(){
    var root=document.getElementById('hk-yatay-kart');
    if(!root) return;
    var wrap=root.querySelector('.hk-amount-presets');
    var amount=root.querySelector('.hk-qty');
    var donate=root.querySelector('.hk-donate-btn');
    var regionButtons=Array.prototype.slice.call(root.querySelectorAll('.hk-country-btn'));
    if(!wrap||!amount) return;
    var changing=false;

    function currentRegion(){
      var active=root.querySelector('.hk-country-btn.active');
      return active&&active.getAttribute('data-region')==='afganistan'?'afganistan':'suriye';
    }

    function setAmount(value,min){
      var number=parseInt(value,10);
      if(!Number.isFinite(number)||number<min) number=min;
      changing=true;
      amount.min=String(min);amount.step='1';amount.value=String(number);
      sendInput(amount);
      changing=false;
      return number;
    }

    function selectButton(value,settings){
      Array.prototype.forEach.call(wrap.querySelectorAll('button'),function(button){
        var preset=parseInt(button.getAttribute('data-amount'),10);
        var selected=Number.isFinite(preset)?preset===value:settings.values.indexOf(value)===-1;
        button.classList.toggle('active',selected);
      });
    }

    function rebuild(region){
      var settings=config(region);
      wrap.innerHTML='';
      settings.values.forEach(function(value){
        var button=document.createElement('button');
        button.type='button';button.setAttribute('data-amount',String(value));button.textContent=value+' Kişi';
        button.addEventListener('click',function(){var number=setAmount(value,settings.min);selectButton(number,settings);});
        wrap.appendChild(button);
      });
      var other=document.createElement('button');
      other.type='button';other.setAttribute('data-other','1');other.textContent='Diğer';
      other.addEventListener('click',function(){
        var number=setAmount(amount.value,settings.min);selectButton(number,settings);amount.focus();amount.select();
      });
      wrap.appendChild(other);
      var start=setAmount(settings.values[0],settings.min);
      selectButton(start,settings);
    }

    regionButtons.forEach(function(button){
      button.addEventListener('click',function(){window.setTimeout(function(){rebuild(button.getAttribute('data-region'));},0);});
    });

    amount.addEventListener('change',function(){
      if(changing) return;
      var settings=config(currentRegion());
      var value=setAmount(amount.value,settings.min);
      selectButton(value,settings);
    });

    if(donate){
      donate.addEventListener('click',function(event){
        var settings=config(currentRegion());
        var value=parseInt(amount.value,10);
        if(!Number.isFinite(value)||value<settings.min){
          event.preventDefault();event.stopPropagation();
          if(event.stopImmediatePropagation) event.stopImmediatePropagation();
          setAmount(settings.min,settings.min);
          if(window.Swal) window.Swal.fire({icon:'warning',title:'Kişi sayısını kontrol edin',text:'Bu bölge için minimum '+settings.min+' kişilik seçim yapılabilir.',confirmButtonColor:'#024040'});
          return false;
        }
      },true);
    }
    rebuild('suriye');
  }

  function syncMobileTitle(){
    var title=document.querySelector('#hk-mevlid-page-intro h2');
    if(!title) return;
    if(!title.dataset.desktopText) title.dataset.desktopText=title.textContent.trim();
    title.textContent=window.innerWidth<=680?'Mevlid Kandili 2026':title.dataset.desktopText;
  }

  function locateFloatingWhatsapp(){
    var links=document.querySelectorAll('a[href*="wa.me/"],a[href*="api.whatsapp.com"],a[href*="whatsapp.com/send"]');
    Array.prototype.forEach.call(links,function(link){
      if(link.closest('.hk-card,.hk-btn-group,.closer,#hk-yatay-kart')) return;
      var style=window.getComputedStyle(link),rect=link.getBoundingClientRect();
      if((style.position==='fixed'||style.position==='sticky')&&rect.width<=110&&rect.height<=110) link.classList.add('hk-v73-floating-wa');
    });
  }

  function repairOverflow(){
    if(window.innerWidth>680) return;
    var items=document.querySelectorAll('.hk-region-table-wrap,.hk-fast-nav,#hk-yatay-kart,.hk-cards-wrap');
    Array.prototype.forEach.call(items,function(item){item.classList.add('hk-v73-overflow-fix');});
  }

  ready(function(){
    normalizeWhatsappLinks();bindAccountButtons();setupCountryPackages();
    syncMobileTitle();locateFloatingWhatsapp();repairOverflow();
    window.addEventListener('resize',function(){syncMobileTitle();locateFloatingWhatsapp();repairOverflow();});
    var observer=new MutationObserver(normalizeWhatsappLinks);
    observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['href']});
  });
})();
</script>
