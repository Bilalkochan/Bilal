<style id="hk-v73-final-css">
html,body{width:100%;max-width:100%;overflow-x:hidden!important}
img,video,iframe{max-width:100%}

/* Bağış / WhatsApp / Hesap Bilgileri buton boşlukları */
.hk-cards-wrap .hk-card-body>.btn-primary{margin:12px 0 0!important}
.hk-cards-wrap .hk-btn-group,
#hk-yatay-kart .hk-btn-group{
  display:flex!important;
  width:100%!important;
  gap:10px!important;
  margin:10px 0 0!important;
  flex-wrap:nowrap!important;
}
.hk-cards-wrap .hk-btn-group .btn,
#hk-yatay-kart .hk-btn-group .btn{
  flex:1 1 0!important;
  width:auto!important;
  min-width:0!important;
  height:50px!important;
  min-height:50px!important;
  margin:0!important;
  padding:0 12px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  border-radius:12px!important;
  line-height:1.1!important;
  white-space:normal!important;
  text-align:center!important;
}
#hk-yatay-kart .hk-donate-btn{margin:0!important}

/* Suriye / Afganistan paketleri */
#hk-yatay-kart .hk-amount-presets{
  grid-template-columns:repeat(5,minmax(0,1fr))!important;
  gap:8px!important;
}
#hk-yatay-kart .hk-amount-presets button{
  min-width:0!important;
  padding:8px 4px!important;
  white-space:nowrap!important;
}
#hk-yatay-kart .hk-amount-presets button[data-other="1"]{border-style:dashed!important}
#hk-yatay-kart .hk-amount-presets button.active::after{content:' ✓';font-weight:900}

/* Hesap Bilgileri popup */
.hk-account-swal{border-radius:18px!important;padding:22px!important}
.hk-account-swal .swal2-title{
  color:#024040!important;
  font-family:'Khand',sans-serif!important;
  font-weight:900!important;
}
.hk-account-swal .swal2-html-container{margin-left:0!important;margin-right:0!important}
.hk-swal-note{text-align:center;font-family:'Khand',sans-serif}
.hk-swal-note__title{margin:0 0 12px;color:#024040;font-size:18px;font-weight:900}
.hk-swal-note__box{
  padding:15px 16px;
  border:1px solid #e1e8ea;
  border-left:6px solid #024040;
  border-radius:14px;
  background:#f7fbfb;
}
.hk-swal-note__line{margin-bottom:8px;color:#333;font-size:14px}
.hk-swal-note__big{
  margin:8px 0;
  color:#b10f0f;
  font-size:16px;
  line-height:1.4;
  font-weight:900;
  text-transform:uppercase;
}
.hk-swal-note__big span{padding:2px 6px;border-radius:6px;background:rgba(177,15,15,.08)}
.hk-swal-note__small,.hk-swal-note__footer{color:#333;font-size:13.5px;line-height:1.5}
.hk-swal-note__footer{margin-top:12px}
.hk-swal-note__footer strong{color:#024040}
.hk-swal-wide{
  width:100%!important;
  padding:14px!important;
  border:0!important;
  border-radius:12px!important;
  background:#0b9450!important;
  color:#fff!important;
  font-family:'Khand',sans-serif!important;
  font-weight:900!important;
}
.hk-account-swal .swal2-close{width:40px!important;height:40px!important;font-size:25px!important;line-height:40px!important}

/* Taşabilecek tablo ve bileşenler */
.hk-region-table-wrap{width:100%!important;max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}
.hk-v73-no-overflow{max-width:100vw!important;overflow-x:auto!important}

@media(max-width:680px){
  #hk-mevlid-page-intro{width:100%!important;max-width:100%!important;overflow:hidden!important}
  #hk-mevlid-page-intro h2{font-size:32px!important;line-height:1.08!important}

  .hk-cards-wrap{
    width:100%!important;
    max-width:100%!important;
    padding:0 10px!important;
    margin-left:auto!important;
    margin-right:auto!important;
    overflow:hidden!important;
  }
  .hk-cards-wrap .hk-card{width:100%!important;max-width:100%!important;margin:8px auto!important}
  .hk-cards-wrap .hk-card-body{width:100%!important;padding:18px 16px!important}

  /* Ana kampanya görselleri mobilde kırpılmaz */
  .hk-cards-wrap .hk-banner{
    width:100%!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    aspect-ratio:auto!important;
    overflow:hidden!important;
  }
  .hk-cards-wrap .hk-banner img{
    position:relative!important;
    width:100%!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    object-fit:contain!important;
    object-position:center!important;
  }

  .hk-cards-wrap .hk-btn-group,
  #hk-yatay-kart .hk-btn-group{
    flex-direction:column!important;
    display:flex!important;
    gap:10px!important;
  }
  .hk-cards-wrap .hk-btn-group .btn,
  #hk-yatay-kart .hk-btn-group .btn{
    flex:none!important;
    width:100%!important;
    margin:0!important;
  }

  #hk-yatay-kart{
    width:100%!important;
    max-width:100%!important;
    padding:0 10px!important;
    overflow:hidden!important;
  }
  #hk-yatay-kart .hk-card{width:100%!important;max-width:100%!important}
  #hk-yatay-kart .hk-banner{
    width:100%!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    aspect-ratio:16/9!important;
    overflow:hidden!important;
  }
  #hk-yatay-kart .hk-banner img{
    width:100%!important;
    height:100%!important;
    object-fit:cover!important;
    object-position:center!important;
  }
  #hk-yatay-kart .hk-amount-presets{grid-template-columns:1fr 1fr!important}
  #hk-yatay-kart .hk-amount-presets button[data-other="1"]{grid-column:1/-1!important}

  /* Sticky, yüzen WhatsApp ve mobil alt menü çakışmaz */
  #hk-sticky72{
    left:10px!important;
    right:10px!important;
    bottom:calc(178px + env(safe-area-inset-bottom))!important;
    width:auto!important;
    max-width:none!important;
  }
  .hk-v73-floating-wa{
    left:14px!important;
    right:auto!important;
    bottom:calc(92px + env(safe-area-inset-bottom))!important;
    z-index:99980!important;
  }
  body{padding-bottom:264px!important}
}

@media(max-width:370px){
  .hk-cards-wrap,#hk-yatay-kart{padding-left:7px!important;padding-right:7px!important}
  #hk-sticky72{left:7px!important;right:7px!important}
}
</style>

<script id="hk-v73-final-js">
(function(){
  'use strict';

  var PHONE='905523925851';
  var PHONE_DISPLAY='0552 392 58 51';
  var ACCOUNT_URL='https://www.hayirkapisi.org.tr/hesap-numaralarimiz';

  function ready(fn){
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fn,{once:true});
    else fn();
  }

  function dispatchTotals(input){
    if(!input) return;
    try{
      input.dispatchEvent(new Event('input',{bubbles:true}));
      input.dispatchEvent(new Event('change',{bubbles:true}));
    }catch(error){}
  }

  function normalizeWhatsappLinks(){
    var links=document.querySelectorAll('a[href*="wa.me/"],a[href*="api.whatsapp.com"],a[href*="whatsapp.com/send"]');
    Array.prototype.forEach.call(links,function(link){
      var href=link.getAttribute('href')||'';
      if(href.indexOf('wa.me/')!==-1){
        href=href.replace(/wa\.me\/\d+/i,'wa.me/'+PHONE);
      }else{
        href=href.replace(/([?&](?:phone|to)=)\+?\d+/i,'$1'+PHONE);
      }
      link.setAttribute('href',href);
    });
  }

  function popupHtml(){
    return '<div class="hk-swal-note">'+
      '<div class="hk-swal-note__title">Önemli Bilgilendirme</div>'+
      '<div class="hk-swal-note__box">'+
        '<div class="hk-swal-note__line">Bağış yaparken banka <strong>açıklama</strong> bölümüne</div>'+
        '<div class="hk-swal-note__big">SADECE <span>CEP TELEFONUNUZU</span> ve <span>“BAĞIŞ”</span> yazınız.</div>'+
        '<div class="hk-swal-note__small">Lütfen banka açıklama kısmına <strong>“BAĞIŞ” dışında</strong> not eklemeyiniz.</div>'+
      '</div>'+
      '<div class="hk-swal-note__footer">Video gönderimi yapılan projelerde görüntü iletimi için <strong>'+PHONE_DISPLAY+'</strong> WhatsApp hattımıza bilgilendirme yapmanızı rica ederiz.</div>'+
    '</div>';
  }

  window.hkHesapPopup=function(first,second){
    var event=null;
    var element=null;

    if(first && typeof first.preventDefault==='function'){
      event=first;
      element=second || first.currentTarget || first.target;
    }else{
      element=first;
    }

    if(event){
      event.preventDefault();
      event.stopPropagation();
    }

    var target=(element && (element.getAttribute('data-href') || element.getAttribute('href'))) || ACCOUNT_URL;

    if(!window.Swal || typeof window.Swal.fire!=='function'){
      window.location.href=target;
      return false;
    }

    window.Swal.fire({
      icon:'success',
      title:'Hesap Bilgilerimiz',
      html:popupHtml(),
      showCloseButton:true,
      showCancelButton:false,
      confirmButtonText:'HESAP BİLGİLERİNE GİT',
      buttonsStyling:false,
      width:620,
      customClass:{popup:'hk-account-swal',confirmButton:'hk-swal-wide'}
    }).then(function(result){
      if(result.isConfirmed) window.location.href=target;
    });

    return false;
  };

  function bindAllAccountLinks(){
    document.addEventListener('click',function(event){
      var link=event.target && event.target.closest ? event.target.closest('a[href*="/hesap-numaralarimiz"],button[data-href*="/hesap-numaralarimiz"],.hk-acc') : null;
      if(!link) return;
      event.preventDefault();
      event.stopPropagation();
      if(event.stopImmediatePropagation) event.stopImmediatePropagation();
      window.hkHesapPopup(event,link);
    },true);
  }

  function packageConfig(region){
    return region==='afganistan'
      ? {min:50,values:[50,100,150,200]}
      : {min:60,values:[60,120,180,240]};
  }

  function setupHorizontalCard(){
    var root=document.getElementById('hk-yatay-kart');
    if(!root) return;

    var presetWrap=root.querySelector('.hk-amount-presets');
    var amount=root.querySelector('.hk-qty');
    var donate=root.querySelector('.hk-donate-btn');
    var regionButtons=Array.prototype.slice.call(root.querySelectorAll('.hk-country-btn'));
    if(!presetWrap || !amount) return;

    function activeRegion(){
      var active=root.querySelector('.hk-country-btn.active');
      return active && active.getAttribute('data-region')==='afganistan' ? 'afganistan' : 'suriye';
    }

    function setAmount(value,min){
      var number=parseInt(value,10);
      if(!Number.isFinite(number) || number<min) number=min;
      amount.min=String(min);
      amount.step='1';
      amount.value=String(number);
      dispatchTotals(amount);
      return number;
    }

    function rebuild(region,keepValue){
      var config=packageConfig(region);
      var current=parseInt(amount.value,10);
      var start=keepValue && Number.isFinite(current) && current>=config.min ? current : config.values[0];

      presetWrap.innerHTML='';
      config.values.forEach(function(value){
        var button=document.createElement('button');
        button.type='button';
        button.setAttribute('data-amount',String(value));
        button.textContent=value+' Kişi';
        if(value===start) button.classList.add('active');
        button.addEventListener('click',function(){
          Array.prototype.forEach.call(presetWrap.querySelectorAll('button'),function(item){item.classList.remove('active');});
          button.classList.add('active');
          setAmount(value,config.min);
        });
        presetWrap.appendChild(button);
      });

      var other=document.createElement('button');
      other.type='button';
      other.setAttribute('data-other','1');
      other.textContent='Diğer';
      if(config.values.indexOf(start)===-1) other.classList.add('active');
      other.addEventListener('click',function(){
        Array.prototype.forEach.call(presetWrap.querySelectorAll('button'),function(item){item.classList.remove('active');});
        other.classList.add('active');
        setAmount(amount.value,config.min);
        amount.focus();
        amount.select();
      });
      presetWrap.appendChild(other);

      setAmount(start,config.min);
    }

    regionButtons.forEach(function(button){
      button.addEventListener('click',function(){
        window.setTimeout(function(){rebuild(button.getAttribute('data-region'),false);},0);
      });
    });

    amount.addEventListener('change',function(){
      var config=packageConfig(activeRegion());
      var value=setAmount(amount.value,config.min);
      Array.prototype.forEach.call(presetWrap.querySelectorAll('button'),function(button){
        var preset=parseInt(button.getAttribute('data-amount'),10);
        button.classList.toggle('active',Number.isFinite(preset) ? preset===value : config.values.indexOf(value)===-1);
      });
    });

    if(donate){
      donate.addEventListener('click',function(event){
        var config=packageConfig(activeRegion());
        var value=parseInt(amount.value,10);
        if(!Number.isFinite(value) || value<config.min){
          event.preventDefault();
          event.stopPropagation();
          if(event.stopImmediatePropagation) event.stopImmediatePropagation();
          setAmount(config.min,config.min);
          if(window.Swal){
            window.Swal.fire({
              icon:'warning',
              title:'Kişi sayısını kontrol edin',
              text:'Bu bölge için minimum '+config.min+' kişilik seçim yapılabilir.',
              confirmButtonColor:'#024040'
            });
          }
          return false;
        }
      },true);
    }

    rebuild('suriye',false);
  }

  function mobileTitle(){
    var title=document.querySelector('#hk-mevlid-page-intro h2');
    if(!title) return;
    if(!title.dataset.desktopText) title.dataset.desktopText=title.textContent.trim();
    title.textContent=window.innerWidth<=680 ? 'Mevlid Kandili 2026' : title.dataset.desktopText;
  }

  function moveFloatingWhatsapp(){
    var links=document.querySelectorAll('a[href*="wa.me/"],a[href*="api.whatsapp.com"],a[href*="whatsapp.com/send"]');
    Array.prototype.forEach.call(links,function(link){
      if(link.closest('.hk-card,.hk-btn-group,.closer,#hk-yatay-kart')) return;
      var style=window.getComputedStyle(link);
      var rect=link.getBoundingClientRect();
      if((style.position==='fixed' || style.position==='sticky') && rect.width<=100 && rect.height<=100){
        link.classList.add('hk-v73-floating-wa');
      }
    });
  }

  function markOverflow(){
    if(window.innerWidth>680) return;
    var nodes=document.querySelectorAll('main section,main div,article section,article div,.page-content section,.page-content div');
    Array.prototype.forEach.call(nodes,function(node){
      var style=window.getComputedStyle(node);
      if(style.position==='fixed' || style.position==='sticky') return;
      var rect=node.getBoundingClientRect();
      if(rect.right>window.innerWidth+2 || rect.left<-2) node.classList.add('hk-v73-no-overflow');
    });
  }

  ready(function(){
    normalizeWhatsappLinks();
    bindAllAccountLinks();
    setupHorizontalCard();
    mobileTitle();
    moveFloatingWhatsapp();
    window.setTimeout(markOverflow,250);
    window.setTimeout(markOverflow,1000);

    window.addEventListener('resize',function(){
      mobileTitle();
      moveFloatingWhatsapp();
      markOverflow();
    });

    var observer=new MutationObserver(function(){normalizeWhatsappLinks();});
    observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['href']});
  });
})();
</script>
